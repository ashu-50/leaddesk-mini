name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch cancels the run already in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: API (lint · build · test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # `postinstall` runs `prisma generate`, so the client exists from here on.
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Compile
        run: npm run build

      - name: Unit tests
        run: npm test

      # The end-to-end suite swaps PrismaService for an in-memory double, so it
      # needs no database service container.
      - name: End-to-end tests
        run: npm run test:e2e

  frontend:
    name: Web (lint · types · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          # Read at build time by the server-side config module. Nothing is
          # called during the build; the value only has to be present.
          API_BASE_URL: http://localhost:4000
          SESSION_COOKIE_NAME: leaddesk_session
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
